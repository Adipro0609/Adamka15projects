<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Buttons</title>
</head>
<body>
    <!-- Example Buttons -->
    <button id="button1">Sound 1</button>
    <button id="button2">Sound 2</button>
    <!-- Repeat for all 100 buttons -->
    
    <script>
        // Function to play sound by URL
        function playSound(url) {
            let audio = new Audio(url);
            audio.play();
        }

        // Assign click handlers for each button
        document.getElementById('button1').addEventListener('click', function() {
            playSound('URL_TO_SOUND_1');
        });
        document.getElementById('button2').addEventListener('click', function() {
            playSound('URL_TO_SOUND_2');
        });
        // Repeat for all other buttons up to button100
    </script>
</body>
</html>
