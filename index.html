<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goofy Ahh Soundboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎵 Goofy Ahh Soundboard</h1>
    
    <!-- Search & Filter -->
    <input 
      type="text" 
      id="searchBox" 
      class="search-box" 
      placeholder="Search sounds..."
    />

    <!-- Soundboard Grid -->
    <div id="soundboard" class="soundboard"></div>
  </div>

  <!-- Audio elements will be inserted by JS -->
  <div id="audioContainer"></div>

  <script src="script.js"></script>
</body>
</html>
